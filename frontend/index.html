<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casa do Código</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --ink: #1f2937;
        --muted: #6b7280;
        --accent: #2563eb;
        --accent-soft: #dbeafe;
        --border: #dfe7f5;
        --success: #16a34a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef4ff, #f8fafc);
        color: var(--ink);
      }
      .shell {
        max-width: 1100px;
        margin: 0 auto;
        padding: 48px 20px 64px;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 16px 20px;
        background: rgba(255,255,255,0.8);
        border: 1px solid var(--border);
        border-radius: 16px;
        backdrop-filter: blur(8px);
      }
      .brand {
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--accent);
      }
      .state {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 0.9rem;
        font-weight: 700;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 0 4px rgba(22,163,74,0.14);
      }
      .grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 24px;
        margin-top: 28px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: 0 18px 38px rgba(30, 41, 59, 0.08);
        padding: 24px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 3rem);
      }
      .subtitle {
        margin: 0 0 22px;
        color: var(--muted);
        line-height: 1.7;
        font-size: 1rem;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 20px;
      }
      button, .button {
        border: 0;
        border-radius: 12px;
        padding: 12px 16px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .primary {
        background: var(--accent);
        color: white;
      }
      .secondary {
        background: #eef2ff;
        color: #1e3a8a;
      }
      .product-list, .product-form {
        display: grid;
        gap: 14px;
      }
      .product-form label {
        display: grid;
        gap: 6px;
        font-weight: 600;
      }
      .product-form input, .product-form textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 11px 12px;
        font: inherit;
      }
      .product-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .product-item-body {
        flex: 1;
      }
      .product-actions {
        display: flex;
        gap: 8px;
      }
      .danger {
        background: #fee2e2;
        color: #991b1b;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 12px;
      }
      li {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #f8fafc;
        padding: 14px 16px;
      }
      li strong {
        display: block;
        margin-bottom: 4px;
      }
      .empty {
        color: var(--muted);
      }
      pre {
        background: #0f172a;
        color: #e2e8f0;
        padding: 14px;
        border-radius: 12px;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 0.9rem;
      }
      @media (max-width: 820px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">CASA DO CÓDIGO</div>
        <div class="state"><span class="dot"></span> Production ready</div>
      </header>

      <section class="grid">
        <div class="card">
          <h1>Catalog management</h1>
          <p class="subtitle">
            This frontend talks to the backend API through the reverse proxy. Use the catalog tools to list products or add new ones.
          </p>

          <div class="actions">
            <button class="primary" id="load-products">Load products</button>
            <button class="secondary" id="health-check">Check health</button>
          </div>

          <pre id="status-output">Waiting for a request...</pre>
        </div>

        <div class="card">
          <h2 id="form-title">Add new product</h2>
          <form class="product-form" id="product-form">
            <input name="id" type="hidden" />
            <label>
              Title
              <input name="titulo" type="text" required placeholder="Clean Architecture" />
            </label>
            <label>
              Description
              <textarea name="descricao" rows="3" required placeholder="A practical guide"></textarea>
            </label>
            <label>
              Pages
              <input name="paginas" type="number" min="1" required placeholder="240" />
            </label>
            <div class="actions" style="margin-top: 0;">
              <button class="primary" type="submit" id="submit-button">Save product</button>
              <button class="secondary" type="button" id="cancel-edit" hidden>Cancel edit</button>
            </div>
          </form>
        </div>
      </section>

      <section class="card" style="margin-top: 24px;">
        <h2>Product list</h2>
        <div class="product-list" id="product-list">
          <div class="empty">No products loaded yet.</div>
        </div>
      </section>
    </div>

    <script>
      const API_AUTH_HEADER = 'Basic ' + btoa('admin:admin123');
      const productList = document.getElementById('product-list');
      const statusOutput = document.getElementById('status-output');
      const productForm = document.getElementById('product-form');
      const formTitle = document.getElementById('form-title');
      const submitButton = document.getElementById('submit-button');
      const cancelEditButton = document.getElementById('cancel-edit');
      let isSubmitting = false;
      let submitDebounceTimer = null;

      async function requestJson(path, options = {}) {
        const response = await fetch(path, {
          headers: {
            'Content-Type': 'application/json',
            Authorization: API_AUTH_HEADER,
            ...(options.headers || {})
          },
          ...options
        });

        if (!response.ok) {
          const text = await response.text();
          throw new Error(`${response.status}: ${text}`);
        }

        if (response.status === 204) {
          return null;
        }

        return response.json();
      }

      function resetForm() {
        productForm.reset();
        productForm.id.value = '';
        formTitle.textContent = 'Add new product';
        submitButton.textContent = 'Save product';
        cancelEditButton.hidden = true;
      }

      async function loadProducts() {
        try {
          const products = await requestJson('/api/produtos');
          if (!products.length) {
            productList.innerHTML = '<div class="empty">No products found.</div>';
            statusOutput.textContent = 'Loaded products: 0';
            return;
          }

          productList.innerHTML = '<ul>' + products.map(product => `
            <li>
              <div class="product-item">
                <div class="product-item-body">
                  <strong>${product.titulo || 'Untitled'}</strong>
                  ${product.descricao || 'No description'}
                  <div>Pages: ${product.paginas || 0}</div>
                </div>
                <div class="product-actions">
                  <button class="secondary" type="button" data-action="edit" data-id="${product.id}">Edit</button>
                  <button class="danger" type="button" data-action="delete" data-id="${product.id}">Delete</button>
                </div>
              </div>
            </li>
          `).join('') + '</ul>';

          productList.querySelectorAll('[data-action="delete"]').forEach(button => {
            button.addEventListener('click', async () => {
              const id = button.dataset.id;
              try {
                await requestJson(`/api/produtos/${id}`, { method: 'DELETE' });
                await loadProducts();
                statusOutput.textContent = `Deleted product ${id}`;
              } catch (error) {
                statusOutput.textContent = 'Delete failed: ' + error.message;
              }
            });
          });

          productList.querySelectorAll('[data-action="edit"]').forEach(button => {
            button.addEventListener('click', async () => {
              const id = button.dataset.id;
              const product = products.find(item => String(item.id) === String(id));
              if (!product) return;

              productForm.id.value = product.id;
              productForm.titulo.value = product.titulo || '';
              productForm.descricao.value = product.descricao || '';
              productForm.paginas.value = product.paginas || 0;
              formTitle.textContent = 'Edit product';
              submitButton.textContent = 'Update product';
              cancelEditButton.hidden = false;
              window.scrollTo({ top: 0, behavior: 'smooth' });
            });
          });

          statusOutput.textContent = `Loaded products: ${products.length}`;
        } catch (error) {
          statusOutput.textContent = 'Error loading products: ' + error.message;
        }
      }

      async function checkHealth() {
        try {
          const health = await requestJson('/api/health');
          statusOutput.textContent = JSON.stringify(health, null, 2);
        } catch (error) {
          statusOutput.textContent = 'Health check failed: ' + error.message;
        }
      }

      document.getElementById('load-products').addEventListener('click', loadProducts);
      document.getElementById('health-check').addEventListener('click', checkHealth);
      cancelEditButton.addEventListener('click', resetForm);

      productForm.addEventListener('submit', (event) => {
        event.preventDefault();
        clearTimeout(submitDebounceTimer);
        submitDebounceTimer = setTimeout(async () => {
          if (isSubmitting) return;

          const id = productForm.id.value;
          const payload = {
            titulo: productForm.titulo.value,
            descricao: productForm.descricao.value,
            paginas: Number(productForm.paginas.value)
          };

          const idempotencyKey = window.crypto && window.crypto.randomUUID
            ? window.crypto.randomUUID()
            : `prod-${Date.now()}-${Math.random().toString(16).slice(2)}`;

          isSubmitting = true;
          submitButton.disabled = true;
          cancelEditButton.disabled = true;

          try {
            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/produtos/${id}` : '/api/produtos';

            const response = await fetch(url, {
              method,
              headers: {
                'Content-Type': 'application/json',
                Authorization: API_AUTH_HEADER,
                'Idempotency-Key': idempotencyKey
              },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              const text = await response.text();
              throw new Error(`${response.status}: ${text}`);
            }

            resetForm();
            await loadProducts();
          } catch (error) {
            statusOutput.textContent = 'Save failed: ' + error.message;
          } finally {
            isSubmitting = false;
            submitButton.disabled = false;
            cancelEditButton.disabled = false;
          }
        }, 180);
      });
    </script>
  </body>
</html>
