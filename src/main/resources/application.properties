quarkus.http.port=${QUARKUS_HTTP_PORT:8080}
quarkus.http.host=${QUARKUS_HTTP_HOST:0.0.0.0}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:8081
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,idempotency-key
quarkus.http.auth.basic=true
quarkus.http.enable-compression=true
quarkus.http.access-log.enabled=true
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.admin=admin123
quarkus.security.users.embedded.roles.admin=admin
quarkus.datasource.db-kind=${QUARKUS_DATASOURCE_DB_KIND:mysql}
quarkus.datasource.devservices.enabled=${QUARKUS_DATASOURCE_DEVSERVICES_ENABLED:false}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:casadocodigo}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:casadocodigo}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:mysql://mysql:3306/casadocodigo}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=4
quarkus.datasource.jdbc.initial-size=4
quarkus.redis.hosts=${REDIS_HOSTS:redis://redis:6379}
quarkus.redis.devservices.enabled=false
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.schema-management.database.action=drop-and-create
quarkus.hibernate-orm.jdbc.statement-cache.size=50
quarkus.thread-pool.core-threads=10
quarkus.thread-pool.max-threads=50
