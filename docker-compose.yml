version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: casadocodigo-mysql
    environment:
      MYSQL_DATABASE: casadocodigo
      MYSQL_USER: casadocodigo
      MYSQL_PASSWORD: casadocodigo
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: casadocodigo-redis
    command: ["redis-server", "--appendonly", "yes", "--protected-mode", "no"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: casadocodigo-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      QUARKUS_HTTP_PORT: "8080"
      QUARKUS_HTTP_HOST: "0.0.0.0"
      QUARKUS_DATASOURCE_DB_KIND: mysql
      QUARKUS_DATASOURCE_USERNAME: casadocodigo
      QUARKUS_DATASOURCE_PASSWORD: casadocodigo
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:mysql://mysql:3306/casadocodigo
      QUARKUS_DATASOURCE_DEVSERVICES_ENABLED: "false"
      REDIS_HOSTS: redis://redis:6379
      JAVA_OPTS: "-Duser.timezone=UTC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75 -XX:+UseG1GC"
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: casadocodigo-frontend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: casadocodigo-nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
